name: Update CBS Injuries

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Scrape CBS injuries
        run: python api/static/update_injuries.py

      - name: Open PR, run tests, merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet api/static/cbs_injuries.json; then
            echo "No changes — skipping PR."
            exit 0
          fi

          branch="cbs-injuries-$(date -u +%Y-%m-%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add api/static/cbs_injuries.json
          git commit -m "update CBS injuries data"
          git push origin "$branch"

          pr_url=$(gh pr create \
            --base main \
            --head "$branch" \
            --title "update CBS injuries data" \
            --body "Automated daily CBS injuries scrape.")
          pr_number=$(gh pr view "$pr_url" --json number -q .number)

          gh workflow run tests.yml --ref "$branch"

          # Wait for the dispatched run to register
          run_id=""
          for _ in $(seq 1 12); do
            sleep 5
            run_id=$(gh run list --branch "$branch" --workflow tests.yml --event workflow_dispatch --limit 1 --json databaseId -q '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
          done
          if [ -z "$run_id" ]; then
            echo "Test run never appeared." >&2
            exit 1
          fi
          echo "Watching test run $run_id"

          # Poll until it completes
          while true; do
            status=$(gh run view "$run_id" --json status -q .status)
            [ "$status" = "completed" ] && break
            sleep 15
          done

          conclusion=$(gh run view "$run_id" --json conclusion -q .conclusion)
          if [ "$conclusion" != "success" ]; then
            echo "Tests failed (conclusion=$conclusion). Leaving PR #$pr_number open." >&2
            exit 1
          fi

          # Branch protection takes time to register the completed check; retry on 405.
          for attempt in $(seq 1 30); do
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/merge" -f merge_method=squash; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "Merge still rejected after retries." >&2
              exit 1
            fi
            sleep 15
          done
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" || true
