name: Update CBS Injuries

permissions:
  contents: read

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-scraper.txt

      - name: Install dependencies
        run: pip install -r requirements-scraper.txt

      - name: Scrape CBS injuries
        run: python api/static/update_injuries.py

      - name: Commit and push to main
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
        run: |
          set -euo pipefail

          if git diff --quiet api/static/cbs_injuries.json; then
            echo "No changes — skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/static/cbs_injuries.json
          git commit -m "update CBS injuries data"
          git push "https://x-access-token:${BOT_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
