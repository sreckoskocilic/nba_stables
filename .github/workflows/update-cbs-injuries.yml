name: Update CBS Injuries

permissions:
  contents: write

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          token: ${{ secrets.BOT_PAT }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'lxml>=5.1,<6'

      - name: Scrape CBS injuries
        run: python api/static/update_injuries.py

      - name: Commit and push to main
        run: |
          set -euo pipefail

          if git diff --quiet api/static/cbs_injuries.json; then
            echo "No changes — skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/static/cbs_injuries.json
          git commit -m "update CBS injuries data"
          git push origin main
