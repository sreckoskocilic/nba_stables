name: Update CBS Injuries

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Scrape CBS injuries
        run: python api/static/update_injuries.py

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet api/static/cbs_injuries.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git pull origin main
            git add api/static/cbs_injuries.json
            git commit -m "update CBS injuries data"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to server
        if: steps.commit.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          version: "1.8.4"
          script: |
            cd /opt/nba_stables
            git pull origin main
