name: Update CBS Injuries

permissions:
  contents: write

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BOT_PAT }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-scraper.txt

      - name: Install dependencies
        run: pip install -r requirements-scraper.txt

      - name: Scrape CBS injuries
        run: python api/static/update_injuries.py

      - name: Commit and push to main
        run: |
          set -euo pipefail

          if git diff --quiet api/static/cbs_injuries.json; then
            echo "No changes — skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/static/cbs_injuries.json
          git commit -m "update CBS injuries data"
          git push origin main
