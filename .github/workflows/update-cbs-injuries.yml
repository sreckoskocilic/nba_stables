name: Update CBS Injuries

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.BOT_PAT }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Scrape CBS injuries
        run: python api/static/update_injuries.py

      - name: Open auto-merging PR
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          set -euo pipefail

          if git diff --quiet api/static/cbs_injuries.json; then
            echo "No changes — skipping PR."
            exit 0
          fi

          branch="cbs-injuries-$(date -u +%Y-%m-%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add api/static/cbs_injuries.json
          git commit -m "update CBS injuries data"
          git push origin "$branch"

          pr_url=$(gh pr create \
            --base main \
            --head "$branch" \
            --title "update CBS injuries data" \
            --body "Automated daily CBS injuries scrape.")
          gh pr merge "$pr_url" --auto --squash --delete-branch
