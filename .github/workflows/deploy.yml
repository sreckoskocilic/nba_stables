name: CI/CD Pipeline

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

on:
  push:
    paths-ignore:
      - ".github/workflows/**"
      - "README.md"
      - "LICENSE"
      - "codecov.yml"
      - "requirements-dev.txt"
      - "requirements-scraper.txt"
      - "ruff.toml"
      - ".env.example"
      - ".github/dependabot.yml"
    branches: [main]
  workflow_dispatch:


jobs:
  run-tests:
    uses: ./.github/workflows/tests.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  deploy:
    name: Deploy Application
    needs:
      - run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          version: "1.8.4"
          script: |
            set -exuo pipefail
            cd /opt/nba_stables
            git fetch origin main
            git reset --hard ${{ github.sha }}
            find . -depth \( -type f -name "*.py[co]" -o -type d -name "__pycache__" \) -delete || true
            docker compose --profile prod build --pull
            docker compose --profile prod up -d --wait
            docker image prune -f
            SITE=/etc/caddy/sites/nba_stables.caddy
            if ! diff -q /opt/nba_stables/Caddyfile "$SITE" >/dev/null 2>&1; then
              PREV=$(mktemp)
              cp "$SITE" "$PREV" 2>/dev/null || rm -f "$PREV"
              cp /opt/nba_stables/Caddyfile "$SITE"
              if ! caddy validate --config /etc/caddy/Caddyfile; then
                if [ -f "$PREV" ]; then mv "$PREV" "$SITE"; else rm -f "$SITE"; fi
                exit 1
              fi
              rm -f "$PREV"
              sudo systemctl restart caddy
            fi
