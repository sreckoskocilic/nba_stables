x-nba-common: &nba-common
  build: .
  ports:
    - "127.0.0.1:8000:8000"
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    - TZ=Europe/Berlin
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  nba-stables:
    <<: *nba-common
    profiles: ["prod"]
    environment:
      - TZ=Europe/Berlin
      - STATS_PROXY=socks5h://host.docker.internal:40001
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - /opt/nba_stables/logs:/app/logs
  nba-stables-dev:
    <<: *nba-common
    profiles: ["dev"]
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - type: bind
        source: ./
        target: /app
