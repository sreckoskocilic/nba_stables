x-nba-common: &nba-common
  build: .
  ports:
    - "127.0.0.1:8000:8000"
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    - TZ=Europe/Berlin
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  nba-stables:
    <<: *nba-common
    profiles: ["prod"]
    environment:
      - TZ=Europe/Berlin
      - STATS_PROXY=socks5h://host.docker.internal:40001
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - /opt/nba_stables/logs:/app/logs
  nba-stables-dev:
    <<: *nba-common
    profiles: ["dev"]
    volumes:
      - type: bind
        source: ./
        target: /app
  umami:
    profiles: [ "prod" ]
    image: ghcr.io/umami-software/umami:3.1.0
    environment:
      DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
      APP_SECRET_FILE: /run/secrets/umami_password
    secrets:
      - umami_password
    depends_on:
      umami-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  umami-db:
    profiles: [ "prod" ]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD_FILE: /run/secrets/umami_pg
    secrets:
      - umami_pg
    volumes:
      - umami_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U umami" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  umami_pgdata:

secrets:
  umami_password:
    file: ./secrets/umami_pwd
  umami_pg:
    file: ./secrets/umami_pg